name: Security review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr-number: {description: "PR number to review", required: true}

jobs:
  security-review:
    uses: cx-kedar-bhujade/prbot/.github/workflows/pr-security-review.yml@checkmarx-one-on-threatmodel-v2
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    with:
      bot-repository: cx-kedar-bhujade/prbot
      bot-ref: checkmarx-one-on-threatmodel-v2
      aws-region: us-east-1         # must match your Bedrock API key / IAM role region
      pr-number: ${{ inputs.pr-number || '' }}
      # provider: auto              # auto | anthropic | bedrock | vertex | openai | gemini
      # model-researcher: opus      # optional per-role override (architect, modeler, researcher, verifier, repair)
      # inline-comments: true       # also comment on the changed lines (needs pull-requests: write); false = summary only
      # max-inline-comments: 20     # per engine
      # pr-description: true        # add a "Summary by prbot" block to the PR description (needs pull-requests: write)
      # cxone-top-n: 10             # Checkmarx One findings shown, combined across SAST, IaC and secrets
      # cxone-scan-timeout-minutes: 10
    secrets:
      # Provide credentials for ONE provider (prbot auto-detects it; or set `provider:` under `with:`).
      # Amazon Bedrock: EITHER a Bedrock API key OR an IAM OIDC role ARN
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      # Anthropic API:
      # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Google Vertex AI (also set `vertex-project-id:` under `with:`):
      # GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      # GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      # OpenAI (Codex CLI):
      # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Google Gemini (Gemini CLI, Google AI Studio key):
      # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Optional Checkmarx One review (SAST, IaC Security, Secret Detection only) in its own PR comment; it is
      # a step in the review job, never a separate required check. See docs/checkmarx-one-integration.md
      # CX_BASE_URI: ${{ secrets.CX_BASE_URI }}
      # CX_TENANT: ${{ secrets.CX_TENANT }}
      # CX_CLIENT_ID: ${{ secrets.CX_CLIENT_ID }}
      # CX_CLIENT_SECRET: ${{ secrets.CX_CLIENT_SECRET }}
      # Optional: only needed if cx-kedar-bhujade/prbot is private or you want comments posted as a custom GitHub App
      # APP_ID: ${{ secrets.APP_ID }}
      # APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
